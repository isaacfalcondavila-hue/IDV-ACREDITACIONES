<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDV | Estado de solicitud</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><div class="brand"><div class="logo">IDV</div><div><b>Estado de acreditación</b><small>Independiente del Valle</small></div></div><a href="/" class="btn secondary tiny">Inicio</a></header><main><div class="wrap"><section class="card status-card" id="box"><p class="muted">Consultando...</p></section></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
(async()=>{let c=new URLSearchParams(location.search).get('codigo');if(!c){box.innerHTML='<div class="notice error">Falta el código de solicitud.</div>';return}let r=await fetch('/api/public/status/'+encodeURIComponent(c));let j=await r.json();if(!r.ok){box.innerHTML='<div class="notice error">'+esc(j.error)+'</div>';return}
let map={pending:['⏳','Solicitud pendiente','Tu solicitud fue recibida y está siendo revisada por IDV.'],approved:['✓','Acreditación aprobada','Tu solicitud fue aprobada. Presenta este QR el día del partido.'],rejected:['×','Solicitud no aprobada','Tu solicitud no fue aprobada para este encuentro.'],delivered:['✓','Credencial entregada','La credencial física ya fue registrada como entregada.']};let m=map[j.status];
box.innerHTML=`<div class="status-icon">${m[0]}</div><div class="eyebrow">${esc(j.title)}</div><h2>${m[1]}</h2><p class="lead" style="margin:10px auto">${m[2]}</p><div class="kv"><div><small>NOMBRE</small><strong>${esc(j.first_name+' '+j.last_name)}</strong></div><div><small>MEDIO</small><strong>${esc(j.media_name)}</strong></div><div><small>TIPO</small><strong>${j.category==='press'?'Prensa escrita':'Fotógrafo'}</strong></div><div><small>ASIGNACIÓN</small><strong>${esc(j.assignment||'Por asignar')}</strong></div></div>${j.qrUrl?`<div class="qr"><img src="${j.qrUrl}"></div><p class="code">${esc(j.public_code)}</p>`:''}${j.admin_notes?`<div class="notice">${esc(j.admin_notes)}</div>`:''}`})();
</script></body></html>
