<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IDV | Estado de solicitud</title>
  <link rel="stylesheet" href="/styles.css">
  
</head>
<body class="status-page">

<header class="topbar">
  <div class="brand-cluster">
    <div class="brand">
      <div class="logo">IDV</div>
      <div>
        <b>Estado de acreditación</b>
        <small>Independiente del Valle</small>
      </div>
    </div>
    <div class="brand-marks" aria-label="Escudos institucionales">
      <img src="/logos/idv.png" alt="Escudo Independiente del Valle">
      <img src="/logos/juniors.png" alt="Escudo Independiente Juniors">
      <img src="/logos/dragonas.png" alt="Escudo Dragonas IDV">
    </div>
  </div>
  <div class="topbar-actions"><a href="/" class="btn secondary tiny">Inicio</a></div>
</header>

<main><div class="wrap">
<div class="status-editorial-head">
  <div class="press-section-label">ACREDITACIONES IDV</div>
  <h1>Estado de acreditación</h1>
  <p class="lead">Consulta el estado oficial de tu solicitud de prensa.</p>
</div>
<section class="card status-card" id="box"><p class="muted">Consultando...</p></section>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const accreditationTypeName=(v,c)=>c==='photo'||v==='fotografo'?'Fotógrafo':({
  medio_digital:'Medio digital',prensa_escrita:'Prensa escrita',radio:'Radio',tv:'TV',camarografo:'Camarógrafo'
})[v]||'Medio de comunicación';
const statusMap={
  pending:['⏳','Solicitud pendiente','Tu solicitud fue recibida y está siendo revisada por IDV.'],
  approved:['✓','Acreditación aprobada','Tu solicitud fue aprobada. Presenta este QR el día del partido.'],
  rejected:['×','Solicitud no aprobada','Tu solicitud no fue aprobada para este encuentro.'],
  delivered:['✓','Credencial entregada','La credencial física ya fue registrada como entregada.']
};
(async()=>{
  const c=new URLSearchParams(location.search).get('codigo');
  if(!c){ box.innerHTML='<div class="notice error">Falta el código de solicitud.</div>'; return; }
  const r=await fetch('/api/public/status/'+encodeURIComponent(c));
  const j=await r.json();
  if(!r.ok){ box.innerHTML='<div class="notice error">'+esc(j.error||'Error')+'</div>'; return; }
  const m=statusMap[j.status] || statusMap.pending;
  box.innerHTML=`<div class="status-icon">${m[0]}</div>
    <div class="eyebrow">${esc(j.title)}</div>
    <h2>${m[1]}</h2>
    <p class="lead" style="margin:10px auto">${m[2]}</p>
    <div class="kv">
      <div><small>NOMBRE</small><strong>${esc(j.first_name+' '+j.last_name)}</strong></div>
      <div><small>MEDIO</small><strong>${esc(j.media_name)}</strong></div>
      <div><small>TIPO</small><strong>${esc(accreditationTypeName(j.accreditation_type,j.category))}</strong></div>
<div><small>NACIONALIDAD</small><strong>${esc(j.nationality||'—')}</strong></div>
      <div><small>ASIGNACIÓN</small><strong>${esc(j.assignment||'Por asignar')}</strong></div>
      <div><small>ASISTENCIA</small><strong>${j.attendance_status==='present'?'Registrada':'Pendiente'}</strong></div>
      <div><small>ESTADO</small><strong>${esc(m[1])}</strong></div>
    </div>
    ${j.qrUrl?`<div class="qr"><img src="${j.qrUrl}" alt="QR de acreditación"></div><p class="code">${esc(j.public_code)}</p>`:''}
    ${j.attendance_status==='present'&&j.attendance_at?`<div class="notice success">Asistencia registrada el ${esc(new Date(j.attendance_at).toLocaleString())}.</div>`:''}
    ${j.admin_notes?`<div class="notice info">${esc(j.admin_notes)}</div>`:''}`;
})();
</script>
</div></main>
</body>
</html>
